name: ms-api

services:
  app:
    container_name: ms-api
    build:
      context: ..
      dockerfile: Dockerfile
      target: final
      args:
        PKG: ./ms-api/cmd/ms-api
    environment:
      AMQP_URL: amqp://${RABBITMQ_USER:?rode ./run.sh, que gera o .env}:${RABBITMQ_PASS:?}@ms-queues:5672/
      HTTP_ADDR: ":8082"
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [ms-go-network]

networks:
  ms-go-network:
    external: true
