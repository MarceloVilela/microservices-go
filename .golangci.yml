version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gosec
    - nilerr
    - noctx
    - sloglint
    - unconvert
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, gosec, noctx]
  settings:
    sloglint:
      no-mixed-args: true
      kv-only: true
formatters:
  enable:
    - gofmt
    - goimports
